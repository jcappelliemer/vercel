# Solaris nginx cutover snippet - 2026-08-04
#
# Non applicare ora. Usare solo al cutover, dopo emissione del certificato
# per solarisfilms.it + www.solarisfilms.it.
#
# Obiettivo:
# - www.solarisfilms.it e il solo host pubblico 200
# - solarisfilms.it redirige sempre a www con 301 singolo hop
# - HTTP redirige sempre a HTTPS www
# - il dominio tecnico staging resta separato

server {
    listen 80;
    listen [::]:80;
    server_name solarisfilms.it www.solarisfilms.it;
    return 301 https://www.solarisfilms.it$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name solarisfilms.it;

    ssl_certificate /etc/letsencrypt/live/solarisfilms.it/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/solarisfilms.it/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://www.solarisfilms.it$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.solarisfilms.it;

    client_max_body_size 64M;

    ssl_certificate /etc/letsencrypt/live/solarisfilms.it/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/solarisfilms.it/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:32768;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }
}

